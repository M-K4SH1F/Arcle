<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=JetBrains+Mono:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column, like a phone game screen. Tier colors are the only accents. Dark first, light on toggle. */
:root {
  --bg: #111118; --surface: #1a1a24; --surface-2: #242432; --line: #30303f;
  --fg: #eeedf6; --muted: #9b9ab2; --on-solid: #111118;
  --t-common: #b4b6c2; --t-rare: #4f8cff; --t-epic: #a66bff; --t-leg: #f2c14e; --t-miss: #3a3a4a;
  --danger: #ff7070; --ok: #5ad19a;
  --f-display: "Dela Gothic One", "Arial Black", Impact, sans-serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f5f4fa; --surface: #ffffff; --surface-2: #ecebf4; --line: #dcdae8;
  --fg: #17161f; --muted: #5f5e78; --on-solid: #ffffff;
  --t-common: #8e919d; --t-rare: #2e6de6; --t-epic: #8a4cf0; --t-leg: #cf960c; --t-miss: #bcbbca;
  --danger: #d13434; --ok: #1f9d63;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--f-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--t-rare); outline-offset: 2px; }
.app { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 24px; display: flex; flex-direction: column; min-height: 100%; }

/* Top bar */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: 14px; border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wordmark { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; }
.wordmark b { font-family: var(--f-display); font-weight: 400; font-size: 26px; letter-spacing: 0.02em; line-height: 1; }
.mark { display: grid; grid-template-columns: repeat(2, 9px); gap: 2px; }
.mark i { width: 9px; height: 9px; border-radius: 2px; display: block; }
.nav { display: flex; gap: 4px; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 8px; background: none; border: 1px solid transparent; color: var(--muted); }
.icon-btn:hover { color: var(--fg); background: var(--surface); }
.icon-btn[aria-current="page"] { color: var(--fg); border-color: var(--line); background: var(--surface); }
.icon-btn svg { width: 20px; height: 20px; }

main { flex: 1; padding-top: 20px; display: flex; flex-direction: column; gap: 20px; }
section { display: flex; flex-direction: column; gap: 18px; }

.test-banner { font-family: var(--f-mono); font-size: 12px; color: var(--t-leg); border: 1px dashed var(--t-leg); border-radius: 8px; padding: 6px 10px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.test-banner button { background: none; border: 0; color: inherit; text-decoration: underline; font-size: 12px; padding: 0; }

/* Tiles */
.tiles { display: flex; gap: 6px; }
.tile { width: 40px; height: 40px; border-radius: 7px; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 700; font-size: 18px; color: var(--on-solid); flex: none; }
.tile.sm { width: 22px; height: 22px; border-radius: 5px; font-size: 11px; }
.tile.empty { background: transparent; border: 2px dashed var(--line); }
.tile.now { border-color: var(--fg); }
.tc-common, .tc-cold { background: var(--t-common); }
.tc-warm { background: var(--t-rare); }
.tc-close { background: var(--t-epic); }
.tc-bullseye { background: var(--t-leg); }
.txt-cold { color: var(--t-common); } .txt-warm { color: var(--t-rare); } .txt-close { color: var(--t-epic); } .txt-bullseye { color: var(--t-leg); }
.clues { display: flex; flex-wrap: wrap; gap: 8px; }
.clue { font-size: 18px; font-weight: 700; padding: 6px 12px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); }
.reveal { margin: 0; font-size: 16px; }
.cmp-wrap { overflow-x: auto; }
.cmp { width: 100%; border-collapse: collapse; font-size: 14px; }
.cmp th, .cmp td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.cmp thead th { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.cmp td:first-child { color: var(--muted); }
.cmp td:last-child { text-align: right; white-space: nowrap; }
.cmp tr.full td:last-child { color: var(--ok); }
.cmp tr.none td:last-child { color: var(--danger); }
.cmp .hint { color: var(--muted); font-family: var(--f-mono); font-size: 12px; white-space: nowrap; }
.tc-rare { background: var(--t-rare); }
.tc-epic { background: var(--t-epic); }
.tc-legendary { background: var(--t-leg); }
.tc-miss { background: var(--t-miss); }
.txt-common { color: var(--t-common); } .txt-rare { color: var(--t-rare); } .txt-epic { color: var(--t-epic); } .txt-legendary { color: var(--t-leg); } .txt-miss { color: var(--muted); }

/* Home */
.hero { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.big-num { font-family: var(--f-display); font-size: 64px; line-height: 1; letter-spacing: 0.01em; }
.big-num span { color: var(--muted); }
.lede { color: var(--muted); max-width: 46ch; margin: 0; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mode { text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.mode strong { font-size: 17px; }
.mode small { color: var(--muted); font-size: 13px; line-height: 1.35; }
.mode[aria-pressed="true"] { border-color: var(--fg); background: var(--surface-2); }
.mode:disabled { cursor: default; opacity: 0.45; }
.mode[aria-pressed="true"]:disabled { opacity: 1; }
.btn { border: 0; border-radius: var(--r); padding: 14px 18px; font-weight: 700; font-size: 17px; background: var(--fg); color: var(--bg); display: inline-flex; justify-content: center; align-items: center; gap: 8px; }
.btn:hover { filter: brightness(0.92); }
.btn.ghost { background: var(--surface); color: var(--fg); border: 1px solid var(--line); }
.btn.small { padding: 9px 14px; font-size: 15px; }
.btn.wide { width: 100%; }
.countdown { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.countdown span { color: var(--muted); font-size: 14px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.countdown .mono { font-size: 20px; font-weight: 700; }
.legend { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.legend div { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; font-size: 13px; }
.legend b { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.note { font-size: 14px; color: var(--muted); margin: 0; }

/* Play */
.play-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.chip { font-family: var(--f-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.chip.hard { color: var(--danger); border-color: var(--danger); }
.score-now { font-family: var(--f-display); font-size: 28px; line-height: 1; }
.score-now small { font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin-left: 4px; }
.timer { display: flex; align-items: center; gap: 10px; }
.timer-track { flex: 1; height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.timer-fill { height: 100%; width: 100%; background: var(--fg); border-radius: 99px; transition: background-color .3s; }
.timer.low .timer-fill { background: var(--danger); }
.timer .mono { width: 3.2ch; text-align: right; font-weight: 700; }
.timer.low .mono { color: var(--danger); }
.prompt-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 8px; }
.prompt-text { font-size: 24px; line-height: 1.3; font-weight: 700; margin: 0; text-wrap: balance; }
.prompt-meta { font-size: 13px; color: var(--muted); font-family: var(--f-mono); }
.guess { display: flex; flex-direction: column; gap: 0; }
.guess input { width: 100%; font-size: 17px; padding: 14px 14px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--surface); outline: none; }
.guess input:focus { border-color: var(--fg); }
.guess.open input { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.sugs { list-style: none; margin: 0; padding: 4px; border: 1.5px solid var(--fg); border-top: 0; border-radius: 0 0 var(--r) var(--r); background: var(--surface); }
.sugs li { padding: 9px 10px; border-radius: 7px; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; cursor: pointer; }
.sugs li > div { min-width: 0; }
.sugs li[aria-selected="true"] { background: var(--surface-2); }
.sugs .en { font-weight: 700; display: block; }
.sugs .ro { font-size: 13px; color: var(--muted); display: block; }
.sugs .used { font-family: var(--f-mono); font-size: 11px; color: var(--muted); text-transform: uppercase; flex: none; }
.sugs li.is-used { cursor: not-allowed; opacity: 0.55; }
.sugs .none { color: var(--muted); font-size: 14px; cursor: default; }
.feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.feed li { font-size: 15px; padding: 9px 12px; border-radius: 8px; background: var(--surface); border-left: 3px solid var(--danger); overflow-wrap: anywhere; }
.feed li.info { border-left-color: var(--muted); color: var(--muted); }
.resolve { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.resolve-top { display: flex; gap: 14px; align-items: center; }
.resolve-top .tile { width: 56px; height: 56px; font-size: 24px; border-radius: 10px; }
.resolve-tier { font-family: var(--f-display); font-size: 26px; line-height: 1.1; }
.resolve-line { margin: 0; font-size: 15px; overflow-wrap: anywhere; }
.examples { display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.examples div { display: flex; gap: 8px; align-items: center; }
.ready { text-align: left; display: flex; flex-direction: column; gap: 12px; }

/* Results */
.res-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.res-score { font-family: var(--f-display); font-size: 64px; line-height: 0.95; }
.res-score small { font-family: var(--f-mono); font-size: 16px; color: var(--muted); }
.res-list { display: flex; flex-direction: column; gap: 10px; }
.res-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.res-item .q { font-size: 14px; color: var(--muted); margin: 0; }
.res-item .a { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.res-item .a .pts { margin-left: auto; font-family: var(--f-mono); }
.rarest { border-top: 1px dashed var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 3px; font-size: 14px; }
.rarest .eyebrow { font-size: 11px; }
.rarest div { display: flex; justify-content: space-between; gap: 10px; }
.rarest div span:last-child { color: var(--muted); font-family: var(--f-mono); font-size: 12px; flex: none; }
.share-row { display: flex; gap: 10px; flex-wrap: wrap; }
.share-row .btn { flex: 1; min-width: 140px; }
.share-preview { font-family: var(--f-mono); font-size: 14px; white-space: pre; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin: 0; overflow-x: auto; }
.toast { font-size: 14px; color: var(--ok); min-height: 1.5em; margin: 0; }
.share-fallback { width: 100%; font-family: var(--f-mono); font-size: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; color: var(--fg); }

/* Stats */
.stat-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.stat-table th, .stat-table td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: right; }
.stat-table th:first-child, .stat-table td:first-child { text-align: left; color: var(--muted); font-weight: 500; }
.stat-table thead th { font-family: var(--f-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.stat-table td { font-family: var(--f-mono); font-size: 17px; }
.stat-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat-box b { font-family: var(--f-display); font-size: 32px; line-height: 1.1; font-weight: 400; }
.stat-box .t { font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
h2 { font-family: var(--f-display); font-weight: 400; font-size: 28px; line-height: 1.15; margin: 0; letter-spacing: 0.01em; }
h3 { font-size: 15px; margin: 0; }
.danger-zone { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn.danger { background: none; border: 1px solid var(--danger); color: var(--danger); }

/* Help */
.rules { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; max-width: 60ch; }
.tier-table-wrap { overflow-x: auto; }
.tier-table { width: 100%; border-collapse: collapse; font-size: 15px; }
.tier-table th, .tier-table td { padding: 9px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.tier-table thead th { font-family: var(--f-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.tier-table td.pts { font-family: var(--f-mono); }
.example-line { font-family: var(--f-mono); font-size: 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; white-space: nowrap; }
.tools { border: 1px dashed var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.tools .row { display: flex; gap: 8px; flex-wrap: wrap; }
.tools input { padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-family: var(--f-mono); }

/* Archive */
.arch-list { display: flex; flex-direction: column; gap: 8px; }
.arch-item { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.arch-item .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.arch-item .info strong { font-family: var(--f-mono); }
.arch-item .info span { color: var(--muted); font-size: 14px; }

footer { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
footer p { margin: 0; max-width: 60ch; }

@media (max-width: 420px) {
  .big-num, .res-score { font-size: 52px; }
  .prompt-text { font-size: 21px; }
  .tile { width: 36px; height: 36px; font-size: 16px; }
  .legend { grid-template-columns: repeat(2, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@keyframes pop { from { transform: scale(0.7); } to { transform: scale(1); } }
.resolve-top .tile { animation: pop .25s ease-out; }
</style>

<div class="app">
  <header class="bar">
    <button class="wordmark" id="go-home" aria-label="Arcle home">
      <span class="mark" aria-hidden="true"><i class="tc-common"></i><i class="tc-rare"></i><i class="tc-epic"></i><i class="tc-legendary"></i></span>
      <b>Arcle</b>
    </button>
    <nav class="nav">
      <button class="icon-btn" data-go="archive" aria-label="Archive" title="Archive"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
      <button class="icon-btn" data-go="stats" aria-label="Stats" title="Stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-9"/></svg></button>
      <button class="icon-btn" data-go="help" aria-label="How to play" title="How to play"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.6V14M12 17.5v.01"/></svg></button>
      <button class="icon-btn" id="theme-btn" aria-label="Switch to light mode" title="Light / dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg></button>
    </nav>
  </header>

  <main>
    <div class="test-banner" id="test-banner" hidden><span id="test-banner-text"></span><button id="test-clear-banner">Back to today</button></div>

    <section id="scr-home"></section>
    <section id="scr-play" hidden>
      <div class="play-head">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span class="eyebrow" id="p-num">Prompt 1 / 5</span>
          <span class="chip" id="p-mode">Easy</span>

        <div class="score-now" id="p-score">0<small>pts</small></div>

          <div class="timer" id="p-timer"><div class="timer-track"><div class="timer-fill" id="p-timer-fill"></div></div><span class="mono" id="p-timer-num">30</span></div>
          <div class="prompt-card"><span class="eyebrow">Find the hidden anime</span><div class="clues" id="p-text"></div><span class="prompt-meta" id="p-meta"></span></div>
          <div id="p-input-area">
            <div class="guess" id="p-guess">
              <label for="guess-input" class="eyebrow" style="margin-bottom:6px">Your guess · one shot</label>
              <input id="guess-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type a title, e.g. Ping Pong or JJK" role="combobox" aria-expanded="false" aria-controls="sug-list" aria-autocomplete="list">
              <ul class="sugs" id="sug-list" role="listbox" hidden></ul>
            </div>
          </div>
          <div class="resolve" id="p-resolve" hidden></div>
          <ul class="feed" id="p-feed" aria-live="polite"></ul>
        </div>
      </div>
    </section>
    <section id="scr-results" hidden></section>
    <section id="scr-stats" hidden></section>
    <section id="scr-help" hidden></section>
    <section id="scr-archive" hidden></section>
  </main>

  <footer>
    <p>Arcle prototype. The list holds <span id="f-count"></span> hand-picked anime. Popularity figures are approximate AniList member counts, entered by hand, not live data. They set how well known each day's hidden anime are. New puzzle every day at 00:00 UTC.</p>
  </footer>
</div>

<script>
// Arcle prototype dataset. Popularity = approximate AniList member count, in thousands.
// Row: [english, romaji, shortNames ("|" separated), year, season, format, source, studios, genres, episodes, popularityK, origin?]
// Seasons: W Sp Su F. Sources: M manga, LN light novel, O original, VN visual novel, N novel, G video game, X other. origin "WN" = began as a web novel.
const RAW = [
["Attack on Titan","Shingeki no Kyojin","AOT|SNK",2013,"Sp","TV","M","Wit Studio","Action|Drama|Fantasy|Mystery",25,930],
["Your Name.","Kimi no Na wa.","Your Name|Kimi no Na wa",2016,"Su","Movie","O","CoMix Wave Films","Drama|Romance|Supernatural",1,860],
["Demon Slayer: Kimetsu no Yaiba","Kimetsu no Yaiba","KNY|Demon Slayer",2019,"Sp","TV","M","ufotable","Action|Adventure|Drama|Fantasy|Supernatural",26,840],
["Death Note","Death Note","DN",2006,"F","TV","M","Madhouse","Mystery|Psychological|Supernatural|Thriller",37,820],
["Fullmetal Alchemist: Brotherhood","Hagane no Renkinjutsushi: Fullmetal Alchemist","FMAB|FMA",2009,"Sp","TV","M","Bones","Action|Adventure|Drama|Fantasy",64,800],
["Jujutsu Kaisen","Jujutsu Kaisen","JJK",2020,"F","TV","M","MAPPA","Action|Supernatural",24,780],

      <div class="big-num"><span>#</span>${n}</div>
      <p class="lede">Five hidden anime to find. One guess each, thirty seconds per guess. The closer your guess, the more it scores.</p>
    </div>
    <div class="modes" role="group" aria-label="Mode">
      <button class="mode" data-mode="easy" aria-pressed="${mode === "easy"}" ${locked ? "disabled" : ""}><strong>Easy</strong><small>See every clue.</small></button>
      <button class="mode" data-mode="hard" aria-pressed="${mode === "hard"}" ${locked ? "disabled" : ""}><strong>Hard</strong><small>One clue fewer per prompt.</small></button>
    </div>
    ${locked ? `<p class="note">Today is locked to ${mode === "hard" ? "Hard" : "Easy"} mode.</p>` : ""}
    ${action}
    <div class="countdown"><span>Next puzzle in</span><b class="mono" id="cd">${hms(msToNextReset())}</b></div>
    ${legendHTML()}`;
  el.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => {
    S.mode = b.dataset.mode; save();
    el.querySelectorAll("[data-mode]").forEach(x => x.setAttribute("aria-pressed", x === b));
  }));
  $("act").addEventListener("click", () => {
    if (rec && rec.done) showResults(t, "daily");
    else startGame(t, "daily", S.mode || "easy");
  });
  const startDay = utcToday();
  homeTimer = setInterval(() => {
    if (!testDate() && utcToday() !== startDay) return renderHome();
    const c = $("cd"); if (c) c.textContent = hms(msToNextReset());
  }, 1000);
}
function legendHTML() {
  return `<div class="legend" aria-label="Tiers">${TIER_KEYS.map(k => `<div>${tileHTML({ tier: k }, true)}<span>${E.TIERS[k].name}</span><b>${TIER_RANGE[k]}</b></div>`).join("")}</div>`;
}

// ---------- Game ----------
let G = null; // { date, kind, rec, day }
let timerId = null;

function startGame(date, kind, mode) {
  const day = E.getDay(date);
  if (!day) return;
  const store = kind === "daily" ? S.days : S.archive;
  if (!store[date]) store[date] = newRec(mode);
  if (kind === "archive" && store[date].done) store[date] = newRec(mode);
  save();
  G = { date, kind, rec: store[date], day };
  if (G.rec.done) return showResults(date, kind);
  show("play");
  renderPlay();
}

function curIdx() { return Math.min(G.rec.results.length, 4); }

function renderPlay() {
  const rec = G.rec;
  const i = rec.results.length;
  $("p-mode").textContent = rec.mode === "hard" ? "Hard" : "Easy";
  $("p-mode").className = "chip" + (rec.mode === "hard" ? " hard" : "");
  $("p-score").innerHTML = `${recScore(rec)}<small>pts</small>`;
  $("p-tiles").innerHTML = tilesHTML(rec, false, i);
  if (i >= 5) return finishGame();
  $("p-num").textContent = `Prompt ${i + 1} / 5` + (G.kind === "archive" ? ` · Archive #${G.day.number}` : "");
  if (!rec.current || rec.current.idx !== i) {
    // Prompt not shown yet. On a fresh start show it right away; after a reload, wait for a tap.
    if (G.resume) {
      $("p-ready").hidden = false; $("p-live").hidden = true;
      $("p-ready").innerHTML = `<h2>Prompt ${i + 1} is ready</h2><p class="note">The 30-second timer starts when the prompt appears.</p><button class="btn wide" id="ready-btn">Show prompt ${i + 1}</button>`;
      $("ready-btn").addEventListener("click", () => { G.resume = false; renderPlay(); });
      return;
    }
    rec.current = { idx: i, startedAt: Date.now() };
    save();
  }
  G.resume = false;
  $("p-ready").hidden = true; $("p-live").hidden = false;
  const p = G.day.prompts[i];
  const clues = E.cluesForMode(p, rec.mode);
  $("p-text").innerHTML = clues.map(c => `<span class="clue">${esc(c.chip)}</span>`).join("");
  $("p-meta").textContent = `${E.fitting(clues).length} anime in the Arcle list fit these clues`;
  $("p-resolve").hidden = true;
  $("p-input-area").hidden = false;
  $("guess-input").value = "";
  closeSugs();
  renderFeed();
  startTimer();
  setTimeout(() => $("guess-input").focus({ preventScroll: true }), 30);
}

function renderFeed() {
  const i = G.rec.results.length;
  const lines = (G.rec.guesses[Math.min(i, 4)] || []).slice().reverse();
  $("p-feed").innerHTML = lines.map(g => `<li class="${g.info ? "info" : ""}">${esc(g.text)}</li>`).join("");
}

function startTimer() {
  stopTimer();
  const tick = () => {
    const cur = G && G.rec.current;
    if (!cur) return stopTimer();
    const left = PROMPT_MS - (Date.now() - cur.startedAt);
    const frac = Math.max(0, left / PROMPT_MS);
    $("p-timer-fill").style.width = (frac * 100) + "%";
    $("p-timer-num").textContent = Math.max(0, Math.ceil(left / 1000));
    $("p-timer").classList.toggle("low", left < 10000);
    if (left <= 0) { stopTimer(); resolveMiss(); }
  };
  tick();
  timerId = setInterval(tick, 100);
}
function stopTimer() { clearInterval(timerId); timerId = null; }

function submitGuess(anime) {
  const rec = G.rec, i = rec.results.length;
  if (!rec.current || rec.current.idx !== i || i >= 5) return;
  if (Date.now() - rec.current.startedAt >= PROMPT_MS) { stopTimer(); return resolveMiss(); }
  const p = G.day.prompts[i];
  const cmp = E.compare(anime, E.BY_ID.get(p.mysteryId));
  const line = `${anime.english} — ${E.TIERS[cmp.tier].name.toUpperCase()} ${E.TIERS[cmp.tier].sq} +${cmp.score}`;
  rec.results[i] = { id: anime.id, tier: cmp.tier, pts: cmp.score, line };
  rec.current = null;
  save();
  stopTimer();
  showResolution(i);
}

function resolveMiss() {
  const rec = G.rec, i = rec.results.length;
  if (i >= 5 || !rec.current) return;
  rec.results[i] = { id: null, tier: "miss", pts: 0 };
  rec.current = null;
  save();
  showResolution(i);
}

function showResolution(i) {
  const r = G.rec.results[i], p = G.day.prompts[i];
  $("p-input-area").hidden = true; closeSugs();
  $("p-score").innerHTML = `${recScore(G.rec)}<small>pts</small>`;
  $("p-tiles").innerHTML = tilesHTML(G.rec, false, -1);
  $("p-timer-fill").style.width = "0%";
  const last = i === 4;
  const mystery = E.BY_ID.get(p.mysteryId);
  let body;
  if (r.tier === "miss") {
    body = `<div class="resolve-top">${tileHTML(r)}<div><div class="resolve-tier txt-miss">Miss</div><span class="note">Time ran out · +0</span></div></div>
      <p class="reveal">The answer was <b>${esc(mystery.english)}</b>.</p>`;
  } else {
    const guess = E.BY_ID.get(r.id);
    body = `<div class="resolve-top">${tileHTML(r)}<div><div class="resolve-tier txt-${r.tier}">${E.TIERS[r.tier].name}</div><span class="note">+${r.pts} points</span></div></div>
      <p class="resolve-line">${esc(r.line)}</p>
      ${r.tier === "bullseye" ? `<p class="reveal">You found it: <b>${esc(mystery.english)}</b>.</p>` : `<p class="reveal">The answer was <b>${esc(mystery.english)}</b>.</p>${cmpTable(guess, mystery)}`}`;
  }
  $("p-resolve").innerHTML = body + `<button class="btn wide" id="next-btn">${last ? "See results" : `Next prompt (${i + 2}/5)`}</button>`;
  $("p-resolve").hidden = false;
  $("p-feed").innerHTML = "";
  $("next-btn").addEventListener("click", () => renderPlay());
  $("next-btn").focus({ preventScroll: true });
}

function cmpTable(guess, mystery) {
  const cmp = E.compare(guess, mystery);
  return `<div class="cmp-wrap"><table class="cmp"><thead><tr><th></th><th>Your guess</th><th>Answer</th><th>Pts</th></tr></thead><tbody>${cmp.rows.map(row => {
    const cls = row.pts === row.max ? "full" : row.pts > 0 ? "part" : "none";
    return `<tr class="${cls}"><td>${row.attr}</td><td>${esc(row.guess)}</td><td>${esc(row.target)}${row.hint ? ` <span class="hint">${esc(row.hint)}</span>` : ""}</td><td class="mono">${row.pts}/${row.max}</td></tr>`;
  }).join("")}</tbody></table></div>`;
}

function finishGame() {
  const rec = G.rec;
  if (!rec.done) {
    rec.done = true;
    if (G.kind === "daily" && !rec.counted) {
      rec.counted = true;
      const m = S.stats[rec.mode];
      m.played++; m.total += recScore(rec);
      m.cur = m.last === addDays(G.date, -1) ? m.cur + 1 : 1;
      m.last = G.date;
      m.best = Math.max(m.best, m.cur);
      rec.results.forEach((r, i) => {
        if (r.tier !== "bullseye") return;
        S.stats.bullseyes++;
        const id = G.day.prompts[i].mysteryId, rank = E.RANK.get(id);
        if (!S.stats.hardest || rank > S.stats.hardest.rank) S.stats.hardest = { id, rank, date: G.date };
      });
    }
    save();
  }
  showResults(G.date, G.kind);
}

// ---------- Autocomplete ----------
const norm = s => s.normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
const INDEX = E.ANIME.map(a => {
  const keys = [a.english, a.romaji, ...a.short].map(norm).filter(Boolean);
  return { a, keys, compact: keys.map(k => k.replace(/ /g, "")) };
});
function suggest(q) {
  const nq = norm(q); if (!nq) return [];
  const cq = nq.replace(/ /g, "");
  const out = [];
  for (const it of INDEX) {
    let best = 9;
    it.keys.forEach((k, j) => {
      const kc = it.compact[j];
      let s = 9;
      if (k === nq || kc === cq) s = 0;
      else if (kc.startsWith(cq)) s = 1;
      else if ((" " + k).includes(" " + nq)) s = 2;
      else if (cq.length >= 3 && kc.includes(cq)) s = 3;
      if (s < best) best = s;
    });
    if (best < 9) out.push({ a: it.a, s: best });
  }
  out.sort((x, y) => x.s - y.s || y.a.popularity - x.a.popularity);
  return out.slice(0, 7).map(x => x.a);
}
let sugs = [], sel = 0;
function renderSugs() {
  const list = $("sug-list"), input = $("guess-input");
  const q = input.value.trim();
  if (!q) return closeSugs();
  list.hidden = false; $("p-guess").classList.add("open"); input.setAttribute("aria-expanded", "true");
  if (!sugs.length) { list.innerHTML = `<li class="none">No match in the Arcle list. Try another spelling or the romaji title.</li>`; return; }
  list.innerHTML = sugs.map((a, j) => {
    const ro = a.romaji !== a.english ? `<span class="ro">${esc(a.romaji)}</span>` : "";
    return `<li role="option" id="sug-${j}" data-j="${j}" aria-selected="${j === sel}"><div><span class="en">${esc(a.english)}</span>${ro}</div></li>`;
  }).join("");
  input.setAttribute("aria-activedescendant", "sug-" + sel);
}
function closeSugs() {
  sugs = []; sel = 0;
  $("sug-list").hidden = true; $("sug-list").innerHTML = "";
  $("p-guess").classList.remove("open");
  $("guess-input").setAttribute("aria-expanded", "false");
}
function pick(j) {
  const a = sugs[j]; if (!a) return;
  $("guess-input").value = "";
  closeSugs();
  submitGuess(a);
}
$("guess-input").addEventListener("input", e => { sugs = suggest(e.target.value); sel = 0; renderSugs(); });
$("guess-input").addEventListener("keydown", e => {
  if (e.key === "ArrowDown" && sugs.length) { sel = (sel + 1) % sugs.length; renderSugs(); e.preventDefault(); }
  else if (e.key === "ArrowUp" && sugs.length) { sel = (sel - 1 + sugs.length) % sugs.length; renderSugs(); e.preventDefault(); }
  else if (e.key === "Enter") { e.preventDefault(); if (sugs.length) pick(sel); }
  else if (e.key === "Escape") closeSugs();
});
$("sug-list").addEventListener("mousedown", e => {
  const li = e.target.closest("li[data-j]"); if (!li) return;
  e.preventDefault(); pick(+li.dataset.j);
});

// ---------- Results ----------
function shareText(rec, day, kind) {
  const head = `Arcle #${day.number} 🎌${rec.mode === "hard" ? " Hard" : ""}`;
  const sq = rec.results.map(r => E.TIERS[r.tier].sq).join("");
  const tail = kind === "daily" ? `${recScore(rec)} pts · streak ${streakNow(rec.mode)}🔥` : `${recScore(rec)} pts · archive`;
  return `${head}\n${sq}\n${tail}`;
}
function showResults(date, kind) {
  show("results");
  renderBanner();
  const rec = (kind === "daily" ? S.days : S.archive)[date];
  const day = E.getDay(date);
  const score = recScore(rec);
  const text = shareText(rec, day, kind);
  const items = day.prompts.map((p, i) => {
    const r = rec.results[i];
    const a = r && r.id ? E.BY_ID.get(r.id) : null;
    const m = E.BY_ID.get(p.mysteryId);
    return `<div class="res-item">
      <p class="q">${i + 1}. ${E.cluesForMode(p, rec.mode).map(c => esc(c.chip)).join(" · ")}</p>
      <div class="a">${tileHTML(r, true)}<span>${a ? esc(a.english) : "No guess"}</span><span class="pts txt-${r.tier}">${E.TIERS[r.tier].name} +${r.pts}</span></div>
      <div class="rarest"><div><span>Answer: <b>${esc(m.english)}</b></span><span>${m.year} · ${esc(m.studios[0])}</span></div></div>
    </div>`;
  }).join("");
  $("scr-results").innerHTML = `
    <div class="res-head">
      <div><span class="eyebrow">Arcle #${day.number} · ${rec.mode === "hard" ? "Hard" : "Easy"}${kind === "archive" ? " · Archive" : ""}</span>
      <div class="res-score">${score}<small> / 500</small></div></div>
      <div class="tiles">${tilesHTML(rec, false, -1)}</div>
    </div>
    ${kind === "archive" ? `<p class="note">Archive games don't count toward streaks or stats.</p>` : ""}
    <pre class="share-preview" id="share-text">${esc(text)}</pre>
    <div class="share-row">
      <button class="btn" id="share-btn">Share result</button>
      <button class="btn ghost" id="res-home">${kind === "archive" ? "Back to archive" : "Home"}</button>
    </div>
    <p class="toast" id="toast" aria-live="polite"></p>
    <div class="res-list">${items}</div>`;
  $("share-btn").addEventListener("click", () => copyShare(text));
  $("res-home").addEventListener("click", () => go(kind === "archive" ? "archive" : "home"));
}
function copyShare(text) {
  const done = () => { $("toast").textContent = "Copied to clipboard."; };
  const fallback = () => {
    $("toast").innerHTML = `Copy didn't work here. Select the text below and copy it.<textarea class="share-fallback" id="share-fb" rows="3" readonly></textarea>`;
    const ta = $("share-fb"); ta.value = text; ta.focus(); ta.select();
  };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
}

// ---------- Stats ----------
function renderStats() {
  show("stats");
  const st = S.stats;
  const row = (label, f) => `<tr><td>${label}</td><td>${f(st.easy, "easy")}</td><td>${f(st.hard, "hard")}</td></tr>`;
  const avg = m => m.played ? Math.round(m.total / m.played) : "–";
  const hb = st.hardest ? E.BY_ID.get(st.hardest.id) : null;
  $("scr-stats").innerHTML = `
    <h2>Stats</h2>
    <div class="tier-table-wrap"><table class="stat-table">
      <thead><tr><th></th><th>Easy</th><th>Hard</th></tr></thead>
      <tbody>
        ${row("Games played", m => m.played)}
        ${row("Current streak", (m, k) => streakNow(k))}
        ${row("Best streak", m => m.best)}
        ${row("Average score", avg)}
      </tbody></table></div>
    <div class="stat-pair">
      <div class="stat-box"><span class="eyebrow">Bullseyes</span><b class="txt-bullseye">${st.bullseyes}</b></div>
      <div class="stat-box"><span class="eyebrow">Hardest bullseye</span>${hb ? `<span class="t">${esc(hb.english)}</span><span class="note">~${fmtPop(hb.popularity)} members · #${E.puzzleNumber(st.hardest.date)}</span>` : `<span class="note">Name a hidden anime exactly to set one.</span>`}</div>
    </div>
    <p class="note">Only daily puzzles count. Archive games and previews don't change these numbers.</p>
    <div class="danger-zone" id="reset-zone"><button class="btn small danger" id="reset-btn">Reset all data</button></div>`;
  $("reset-btn").addEventListener("click", () => {
    $("reset-zone").innerHTML = `<span class="note">Delete all streaks, stats and saved games on this device?</span>
      <button class="btn small danger" id="reset-yes">Delete everything</button><button class="btn small ghost" id="reset-no">Keep my data</button>`;
    $("reset-yes").addEventListener("click", () => { const th = S.theme; S = fresh(); S.theme = th; save(); renderStats(); });
    $("reset-no").addEventListener("click", renderStats);
  });
}

// ---------- How to play ----------
function renderHelp() {
  show("help");
  const rows = [["bullseye", "You named the hidden anime exactly"], ["close", "Very close: shares most details"], ["warm", "Fits the clues, but differs in places"], ["cold", "Far off"], ["miss", "No guess before time ran out"]];
  $("scr-help").innerHTML = `
    <h2>How to play</h2>
    <ol class="rules">
      <li>Each day has 5 hidden anime to find. Everyone gets the same ones.</li>
      <li>Each prompt shows a few clues, like genre, studio, decade, source or episode count. No plot details.</li>
      <li>You get one guess per prompt and 30 seconds to make it. Pick a title from the list and it locks in.</li>
      <li>A guess scores up to 90 points for how close it is: year (20), genres (20), episodes (15), studio (15), source (10) and format (10). Naming the exact anime scores 100.</li>
      <li>Prompts get harder through the day: later answers are less well known, and their clues fit more anime.</li>
      <li>Hard mode shows one clue fewer per prompt. Easy and Hard keep separate streaks. Pick a mode before you start; it stays fixed for the day.</li>
      <li>A new puzzle arrives at 00:00 UTC. The last 7 days are in the archive, for practice.</li>
    </ol>
    <div class="tier-table-wrap"><table class="tier-table">
      <thead><tr><th>Tier</th><th>Points</th><th>Meaning</th></tr></thead>
      <tbody>${rows.map(([k, rule]) => `<tr><td><span style="display:flex;gap:8px;align-items:center">${tileHTML({ tier: k }, true)}${E.TIERS[k].name}</span></td><td class="pts">${TIER_RANGE[k]}</td><td>${rule}</td></tr>`).join("")}</tbody>
    </table></div>
    <h3>Example</h3>
    <div class="example-line">Clues: Sports · From a manga · 2010s · 2–13 episodes</div>
    <div class="example-line">Haikyu!! — WARM 🟦 +52 · The answer was Ping Pong the Animation</div>
    <div class="tools">
      <h3>Prototype testing</h3>
      <p class="note">Load any day's puzzle as if it were today. It counts for stats like a normal day, so reset data after testing. You can also add <span class="mono">?date=2026-10-25</span> to the file's URL, or <span class="mono">#date-2026-10-25</span> to the artifact link.</p>
      <div class="row"><input type="date" id="test-date" aria-label="Test date" min="${E.EPOCH}" value="${testDate() || ""}"><button class="btn small" id="test-load">Load this date</button><button class="btn small ghost" id="test-clear">Use real date</button></div>
    </div>`;
  $("test-load").addEventListener("click", () => {
    const v = $("test-date").value;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(v) || E.puzzleNumber(v) < 1) { $("test-date").focus(); return; }
    S.testDate = v; save(); go("home");
  });
  $("test-clear").addEventListener("click", () => { S.testDate = null; save(); go("home"); });
}

// ---------- Archive ----------
function renderArchive() {
  show("archive");
  const t = today();
  const days = [];
  for (let k = 1; k <= 7; k++) { const d = addDays(t, -k); if (E.puzzleNumber(d) >= 1) days.push(d); }
  const items = days.map(d => {
    const rec = S.archive[d];
    const status = rec && rec.done ? `<span class="tiles">${tilesHTML(rec, true)}</span><span>${recScore(rec)} pts · ${rec.mode === "hard" ? "Hard" : "Easy"}</span>`
      : rec && rec.results.length ? `<span>In progress: ${rec.results.length} / 5</span>` : `<span>Not played</span>`;
    const label = rec && rec.done ? "View" : rec && rec.results.length ? "Continue" : "Play";
    return `<div class="arch-item"><div class="info"><strong>#${E.puzzleNumber(d)} · ${shortDate(d)}</strong>${status}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
        ${rec && rec.done ? `<button class="btn small ghost" data-replay="${d}">Replay</button>` : ""}
        <button class="btn small" data-arch="${d}">${label}</button></div></div>`;
  }).join("");
  $("scr-archive").innerHTML = `
    <h2>Archive</h2>
    <p class="note">Play the last 7 days for practice. Archive games don't count toward streaks or stats.</p>
    ${days.length ? `<div class="modes" role="group" aria-label="Archive mode">
      <button class="mode" data-amode="easy" aria-pressed="${(S.mode || "easy") === "easy"}"><strong>Easy</strong><small>See every clue.</small></button>
      <button class="mode" data-amode="hard" aria-pressed="${S.mode === "hard"}"><strong>Hard</strong><small>One clue fewer per prompt.</small></button></div>
      <div class="arch-list">${items}</div>`
    : `<p class="note">Nothing here yet. The archive fills up as days pass after puzzle #1 on ${niceDate(E.EPOCH)}.</p>`}`;
  $("scr-archive").querySelectorAll("[data-amode]").forEach(b => b.addEventListener("click", () => {
    S.mode = b.dataset.amode; save();
    $("scr-archive").querySelectorAll("[data-amode]").forEach(x => x.setAttribute("aria-pressed", x === b));
  }));
  $("scr-archive").querySelectorAll("[data-arch]").forEach(b => b.addEventListener("click", () => {
    const d = b.dataset.arch, rec = S.archive[d];
    if (rec && rec.done) return showResults(d, "archive");
    startGame(d, "archive", S.mode || "easy");
  }));
  $("scr-archive").querySelectorAll("[data-replay]").forEach(b => b.addEventListener("click", () => {
    const d = b.dataset.replay; delete S.archive[d]; save(); startGame(d, "archive", S.mode || "easy");
  }));
}

// ---------- Boot ----------
$("f-count").textContent = E.ANIME.length;
applyTheme();
renderBanner();
(function boot() {
  const t = today();
  const rec = S.days[t];
  if (E.puzzleNumber(t) >= 1 && rec && !rec.done && (rec.results.length || rec.current)) {
    G = { date: t, kind: "daily", rec, day: E.getDay(t), resume: true };
    show("play");
    // A prompt that was already on screen keeps its original start time; the timer is not reset by reloading.
    if (rec.current && rec.current.idx === rec.results.length) G.resume = false;
    renderPlay();
    return;
  }
  renderHome();
})();
window.__arcle = { E, get S() { return S; }, get G() { return G; } };
})();

</script>
