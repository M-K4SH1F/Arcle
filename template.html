<title>Arcle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=JetBrains+Mono:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column, like a phone game screen. Tier colors are the only accents. Dark first, light on toggle. */
:root {
  --bg: #111118; --surface: #1a1a24; --surface-2: #242432; --line: #30303f;
  --fg: #eeedf6; --muted: #9b9ab2; --on-solid: #111118;
  --t-common: #b4b6c2; --t-rare: #4f8cff; --t-epic: #a66bff; --t-leg: #f2c14e; --t-miss: #3a3a4a;
  --danger: #ff7070; --ok: #5ad19a;
  --f-display: "Dela Gothic One", "Arial Black", Impact, sans-serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f5f4fa; --surface: #ffffff; --surface-2: #ecebf4; --line: #dcdae8;
  --fg: #17161f; --muted: #5f5e78; --on-solid: #ffffff;
  --t-common: #8e919d; --t-rare: #2e6de6; --t-epic: #8a4cf0; --t-leg: #cf960c; --t-miss: #bcbbca;
  --danger: #d13434; --ok: #1f9d63;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--f-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--t-rare); outline-offset: 2px; }
.app { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 24px; display: flex; flex-direction: column; min-height: 100%; }

/* Top bar */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: 14px; border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wordmark { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; }
.wordmark b { font-family: var(--f-display); font-weight: 400; font-size: 26px; letter-spacing: 0.02em; line-height: 1; }
.mark { display: grid; grid-template-columns: repeat(2, 9px); gap: 2px; }
.mark i { width: 9px; height: 9px; border-radius: 2px; display: block; }
.nav { display: flex; gap: 4px; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 8px; background: none; border: 1px solid transparent; color: var(--muted); }
.icon-btn:hover { color: var(--fg); background: var(--surface); }
.icon-btn[aria-current="page"] { color: var(--fg); border-color: var(--line); background: var(--surface); }
.icon-btn svg { width: 20px; height: 20px; }

main { flex: 1; padding-top: 20px; display: flex; flex-direction: column; gap: 20px; }
section { display: flex; flex-direction: column; gap: 18px; }

.test-banner { font-family: var(--f-mono); font-size: 12px; color: var(--t-leg); border: 1px dashed var(--t-leg); border-radius: 8px; padding: 6px 10px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.test-banner button { background: none; border: 0; color: inherit; text-decoration: underline; font-size: 12px; padding: 0; }

/* Tiles */
.tiles { display: flex; gap: 6px; }
.tile { width: 40px; height: 40px; border-radius: 7px; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 700; font-size: 18px; color: var(--on-solid); flex: none; }
.tile.sm { width: 22px; height: 22px; border-radius: 5px; font-size: 11px; }
.tile.empty { background: transparent; border: 2px dashed var(--line); }
.tile.now { border-color: var(--fg); }
.tc-common, .tc-cold { background: var(--t-common); }
.tc-warm { background: var(--t-rare); }
.tc-close { background: var(--t-epic); }
.tc-bullseye { background: var(--t-leg); }
.txt-cold { color: var(--t-common); } .txt-warm { color: var(--t-rare); } .txt-close { color: var(--t-epic); } .txt-bullseye { color: var(--t-leg); }
.clues { display: flex; flex-wrap: wrap; gap: 8px; }
.clue { font-size: 18px; font-weight: 700; padding: 6px 12px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); }
.reveal { margin: 0; font-size: 16px; }
.cmp-wrap { overflow-x: auto; }
.cmp { width: 100%; border-collapse: collapse; font-size: 14px; }
.cmp th, .cmp td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.cmp thead th { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.cmp td:first-child { color: var(--muted); }
.cmp td:last-child { text-align: right; white-space: nowrap; }
.cmp tr.full td:last-child { color: var(--ok); }
.cmp tr.none td:last-child { color: var(--danger); }
.cmp .hint { color: var(--muted); font-family: var(--f-mono); font-size: 12px; white-space: nowrap; }
.tc-rare { background: var(--t-rare); }
.tc-epic { background: var(--t-epic); }
.tc-legendary { background: var(--t-leg); }
.tc-miss { background: var(--t-miss); }
.txt-common { color: var(--t-common); } .txt-rare { color: var(--t-rare); } .txt-epic { color: var(--t-epic); } .txt-legendary { color: var(--t-leg); } .txt-miss { color: var(--muted); }

/* Home */
.hero { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.big-num { font-family: var(--f-display); font-size: 64px; line-height: 1; letter-spacing: 0.01em; }
.big-num span { color: var(--muted); }
.lede { color: var(--muted); max-width: 46ch; margin: 0; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mode { text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.mode strong { font-size: 17px; }
.mode small { color: var(--muted); font-size: 13px; line-height: 1.35; }
.mode[aria-pressed="true"] { border-color: var(--fg); background: var(--surface-2); }
.mode:disabled { cursor: default; opacity: 0.45; }
.mode[aria-pressed="true"]:disabled { opacity: 1; }
.btn { border: 0; border-radius: var(--r); padding: 14px 18px; font-weight: 700; font-size: 17px; background: var(--fg); color: var(--bg); display: inline-flex; justify-content: center; align-items: center; gap: 8px; }
.btn:hover { filter: brightness(0.92); }
.btn.ghost { background: var(--surface); color: var(--fg); border: 1px solid var(--line); }
.btn.small { padding: 9px 14px; font-size: 15px; }
.btn.wide { width: 100%; }
.countdown { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.countdown span { color: var(--muted); font-size: 14px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.countdown .mono { font-size: 20px; font-weight: 700; }
.legend { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.legend div { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; font-size: 13px; }
.legend b { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.note { font-size: 14px; color: var(--muted); margin: 0; }

/* Play */
.play-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.chip { font-family: var(--f-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.chip.hard { color: var(--danger); border-color: var(--danger); }
.score-now { font-family: var(--f-display); font-size: 28px; line-height: 1; }
.score-now small { font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin-left: 4px; }
.timer { display: flex; align-items: center; gap: 10px; }
.timer-track { flex: 1; height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.timer-fill { height: 100%; width: 100%; background: var(--fg); border-radius: 99px; transition: background-color .3s; }
.timer.low .timer-fill { background: var(--danger); }
.timer .mono { width: 3.2ch; text-align: right; font-weight: 700; }
.timer.low .mono { color: var(--danger); }
.prompt-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 8px; }
.prompt-text { font-size: 24px; line-height: 1.3; font-weight: 700; margin: 0; text-wrap: balance; }
.prompt-meta { font-size: 13px; color: var(--muted); font-family: var(--f-mono); }
.guess { display: flex; flex-direction: column; gap: 0; }
.guess input { width: 100%; font-size: 17px; padding: 14px 14px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--surface); outline: none; }
.guess input:focus { border-color: var(--fg); }
.guess.open input { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.sugs { list-style: none; margin: 0; padding: 4px; border: 1.5px solid var(--fg); border-top: 0; border-radius: 0 0 var(--r) var(--r); background: var(--surface); }
.sugs li { padding: 9px 10px; border-radius: 7px; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; cursor: pointer; }
.sugs li > div { min-width: 0; }
.sugs li[aria-selected="true"] { background: var(--surface-2); }
.sugs .en { font-weight: 700; display: block; }
.sugs .ro { font-size: 13px; color: var(--muted); display: block; }
.sugs .used { font-family: var(--f-mono); font-size: 11px; color: var(--muted); text-transform: uppercase; flex: none; }
.sugs li.is-used { cursor: not-allowed; opacity: 0.55; }
.sugs .none { color: var(--muted); font-size: 14px; cursor: default; }
.feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.feed li { font-size: 15px; padding: 9px 12px; border-radius: 8px; background: var(--surface); border-left: 3px solid var(--danger); overflow-wrap: anywhere; }
.feed li.info { border-left-color: var(--muted); color: var(--muted); }
.resolve { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.resolve-top { display: flex; gap: 14px; align-items: center; }
.resolve-top .tile { width: 56px; height: 56px; font-size: 24px; border-radius: 10px; }
.resolve-tier { font-family: var(--f-display); font-size: 26px; line-height: 1.1; }
.resolve-line { margin: 0; font-size: 15px; overflow-wrap: anywhere; }
.examples { display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.examples div { display: flex; gap: 8px; align-items: center; }
.ready { text-align: left; display: flex; flex-direction: column; gap: 12px; }

/* Results */
.res-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.res-score { font-family: var(--f-display); font-size: 64px; line-height: 0.95; }
.res-score small { font-family: var(--f-mono); font-size: 16px; color: var(--muted); }
.res-list { display: flex; flex-direction: column; gap: 10px; }
.res-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.res-item .q { font-size: 14px; color: var(--muted); margin: 0; }
.res-item .a { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.res-item .a .pts { margin-left: auto; font-family: var(--f-mono); }
.rarest { border-top: 1px dashed var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 3px; font-size: 14px; }
.rarest .eyebrow { font-size: 11px; }
.rarest div { display: flex; justify-content: space-between; gap: 10px; }
.rarest div span:last-child { color: var(--muted); font-family: var(--f-mono); font-size: 12px; flex: none; }
.share-row { display: flex; gap: 10px; flex-wrap: wrap; }
.share-row .btn { flex: 1; min-width: 140px; }
.share-preview { font-family: var(--f-mono); font-size: 14px; white-space: pre; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin: 0; overflow-x: auto; }
.toast { font-size: 14px; color: var(--ok); min-height: 1.5em; margin: 0; }
.share-fallback { width: 100%; font-family: var(--f-mono); font-size: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; color: var(--fg); }

/* Stats */
.stat-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.stat-table th, .stat-table td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: right; }
.stat-table th:first-child, .stat-table td:first-child { text-align: left; color: var(--muted); font-weight: 500; }
.stat-table thead th { font-family: var(--f-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.stat-table td { font-family: var(--f-mono); font-size: 17px; }
.stat-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat-box b { font-family: var(--f-display); font-size: 32px; line-height: 1.1; font-weight: 400; }
.stat-box .t { font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
h2 { font-family: var(--f-display); font-weight: 400; font-size: 28px; line-height: 1.15; margin: 0; letter-spacing: 0.01em; }
h3 { font-size: 15px; margin: 0; }
.danger-zone { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn.danger { background: none; border: 1px solid var(--danger); color: var(--danger); }

/* Help */
.rules { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; max-width: 60ch; }
.tier-table-wrap { overflow-x: auto; }
.tier-table { width: 100%; border-collapse: collapse; font-size: 15px; }
.tier-table th, .tier-table td { padding: 9px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.tier-table thead th { font-family: var(--f-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.tier-table td.pts { font-family: var(--f-mono); }
.example-line { font-family: var(--f-mono); font-size: 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; white-space: nowrap; }
.tools { border: 1px dashed var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.tools .row { display: flex; gap: 8px; flex-wrap: wrap; }
.tools input { padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-family: var(--f-mono); }

/* Archive */
.arch-list { display: flex; flex-direction: column; gap: 8px; }
.arch-item { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.arch-item .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.arch-item .info strong { font-family: var(--f-mono); }
.arch-item .info span { color: var(--muted); font-size: 14px; }

footer { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
footer p { margin: 0; max-width: 60ch; }

@media (max-width: 420px) {
  .big-num, .res-score { font-size: 52px; }
  .prompt-text { font-size: 21px; }
  .tile { width: 36px; height: 36px; font-size: 16px; }
  .legend { grid-template-columns: repeat(2, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@keyframes pop { from { transform: scale(0.7); } to { transform: scale(1); } }
.resolve-top .tile { animation: pop .25s ease-out; }
</style>

<div class="app">
  <header class="bar">
    <button class="wordmark" id="go-home" aria-label="Arcle home">
      <span class="mark" aria-hidden="true"><i class="tc-common"></i><i class="tc-rare"></i><i class="tc-epic"></i><i class="tc-legendary"></i></span>
      <b>Arcle</b>
    </button>
    <nav class="nav">
      <button class="icon-btn" data-go="archive" aria-label="Archive" title="Archive"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
      <button class="icon-btn" data-go="stats" aria-label="Stats" title="Stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-9"/></svg></button>
      <button class="icon-btn" data-go="help" aria-label="How to play" title="How to play"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.6V14M12 17.5v.01"/></svg></button>
      <button class="icon-btn" id="theme-btn" aria-label="Switch to light mode" title="Light / dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg></button>
    </nav>
  </header>

  <main>
    <div class="test-banner" id="test-banner" hidden><span id="test-banner-text"></span><button id="test-clear-banner">Back to today</button></div>

    <section id="scr-home"></section>
    <section id="scr-play" hidden>
      <div class="play-head">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span class="eyebrow" id="p-num">Prompt 1 / 5</span>
          <span class="chip" id="p-mode">Easy</span>
        </div>
        <div class="score-now" id="p-score">0<small>pts</small></div>
      </div>
      <div class="tiles" id="p-tiles" aria-label="Progress"></div>
      <div id="p-ready" class="ready" hidden></div>
      <div id="p-live">
        <div style="display:flex;flex-direction:column;gap:16px">
          <div class="timer" id="p-timer"><div class="timer-track"><div class="timer-fill" id="p-timer-fill"></div></div><span class="mono" id="p-timer-num">30</span></div>
          <div class="prompt-card"><span class="eyebrow">Find the hidden anime</span><div class="clues" id="p-text"></div><span class="prompt-meta" id="p-meta"></span></div>
          <div id="p-input-area">
            <div class="guess" id="p-guess">
              <label for="guess-input" class="eyebrow" style="margin-bottom:6px">Your guess · one shot</label>
              <input id="guess-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type a title, e.g. Ping Pong or JJK" role="combobox" aria-expanded="false" aria-controls="sug-list" aria-autocomplete="list">
              <ul class="sugs" id="sug-list" role="listbox" hidden></ul>
            </div>
          </div>
          <div class="resolve" id="p-resolve" hidden></div>
          <ul class="feed" id="p-feed" aria-live="polite"></ul>
        </div>
      </div>
    </section>
    <section id="scr-results" hidden></section>
    <section id="scr-stats" hidden></section>
    <section id="scr-help" hidden></section>
    <section id="scr-archive" hidden></section>
  </main>

  <footer>
    <p>Arcle prototype. The list holds <span id="f-count"></span> hand-picked anime. Popularity figures are approximate AniList member counts, entered by hand, not live data. They set how well known each day's hidden anime are. New puzzle every day at 00:00 UTC.</p>
  </footer>
</div>
